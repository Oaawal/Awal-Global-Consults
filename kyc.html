  <meta charset="UTF-8"/>

<body>

<!-- Toast -->
<div class="agc-toast" id="agc-toast"></div>

<!-- Header -->
<header class="agc-header">
  <div class="agc-header-inner">
    <img src="../assets/images/logo.png" alt="Awal Global Consults"
      class="agc-logo" onerror="this.style.display='none'">
    <div class="agc-header-text">
      <h1>Client Intake & KYC</h1>
      <p>Awal Global Consults Limited — Governance | Risk | Compliance</p>
    </div>
  </div>
</header>

<!-- Progress bar (hidden on welcome/resume) -->
<div class="agc-progress-wrap" id="agc-progress-wrap" style="display:none;">
  <div class="agc-progress-inner">
    <div class="agc-progress-steps" id="agc-progress-steps"></div>
  </div>
</div>

<!-- Main -->
<main id="agc-main">

  <!-- Welcome screen -->
  <div class="agc-screen" id="screen-welcome"></div>

  <!-- Resume screen -->
  <div class="agc-screen" id="screen-resume"></div>

  <!-- Service selection -->

  <!-- Personal details -->
  <div class="agc-screen" id="screen-personal"></div>

  <div class="agc-screen" id="screen-tax_clearance"></div>
  <div class="agc-screen" id="screen-vat"></div>
  <div class="agc-screen" id="screen-paye"></div>
  <div class="agc-screen" id="screen-payroll"></div>
  <div class="agc-screen" id="screen-accounting"></div>
  <div class="agc-screen" id="screen-scuml"></div>

  <div class="agc-screen" id="screen-son"></div>
  <div class="agc-screen" id="screen-nafdac"></div>
  <div class="agc-screen" id="screen-ndpr"></div>
  <div class="agc-screen" id="screen-iso"></div>
  <div class="agc-screen" id="screen-trademark"></div>
  <div class="agc-screen" id="screen-copyright"></div>
  <div class="agc-screen" id="screen-legal_doc"></div>
  <div class="agc-screen" id="screen-legal_advisory"></div>

  <div class="agc-screen" id="screen-immigration"></div>
  <div class="agc-screen" id="screen-export_import"></div>
  <div class="agc-screen" id="screen-cybersecurity"></div>
  <div class="agc-screen" id="screen-virtual_office"></div>
  <div class="agc-screen" id="screen-domain"></div>
  <div class="agc-screen" id="screen-website"></div>

  <div class="agc-screen" id="screen-docs"></div>
  <div class="agc-screen" id="screen-payment"></div>
  <div class="agc-screen" id="screen-declaration"></div>
  <div class="agc-screen" id="screen-success"></div>

</main>

<!-- Hidden FormSubmit form -->
<form id="agc-hidden-form"
  method="POST"
  action="https://formsubmit.co/info@awalglobal.com.ng"
  enctype="multipart/form-data"
  style="display:none;">
  <input type="hidden" name="_captcha"  value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_next"     value="https://awalglobal.com.ng/thank-you.html">
  <input type="hidden" name="_subject"  id="h-subject"   value="New Client KYC Submission">
  <input type="hidden" name="Services"  id="h-services"  value="">
  <input type="hidden" name="Total"     id="h-total"     value="">
  <input type="hidden" name="Resume_ID" id="h-resume-id" value="">
</form>

<!-- ── Config (load first) ── -->
<script src="config/services.js"></script>
<script src="config/payment.js"></script>

<!-- ── Engine (load second) ── -->
<script src="engine/storage.js"></script>

<!-- ── Init ── -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Register end screens in router's BASE flow
    AGC_Router.init();
  });
</script>

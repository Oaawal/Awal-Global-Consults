<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" fill="#5b6472" font-size="13" letter-spacing="1">EFFECTIVE 1 JANUARY 2026</text>

  <!-- NTA -->
  <rect x="20" y="50" width="205" height="230" rx="14" fill="#0d2340"/>
  <text x="122" y="85" text-anchor="middle" fill="#e8cf87" font-size="13" font-weight="700">NTA</text>
  <text x="122" y="108" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Nigeria Tax Act</text>
  <text x="122" y="140" text-anchor="middle" fill="#c9d3de" font-size="11">Consolidates CIT, PIT,</text>
  <text x="122" y="156" text-anchor="middle" fill="#c9d3de" font-size="11">VAT, CGT, Stamp Duty</text>
  <text x="122" y="172" text-anchor="middle" fill="#c9d3de" font-size="11">into one law</text>
  <text x="122" y="205" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">Sets the rates &amp;</text>
  <text x="122" y="221" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">exemptions</text>

  <!-- NTAA -->
  <rect x="240" y="50" width="205" height="230" rx="14" fill="#16345c"/>
  <text x="342" y="85" text-anchor="middle" fill="#e8cf87" font-size="13" font-weight="700">NTAA</text>
  <text x="342" y="108" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Tax Administration Act</text>
  <text x="342" y="140" text-anchor="middle" fill="#c9d3de" font-size="11">Registration, filing</text>
  <text x="342" y="156" text-anchor="middle" fill="#c9d3de" font-size="11">deadlines, penalties,</text>
  <text x="342" y="172" text-anchor="middle" fill="#c9d3de" font-size="11">and TIN rules</text>
  <text x="342" y="205" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">Sets the process &amp;</text>
  <text x="342" y="221" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">deadlines</text>

  <!-- NRSA -->
  <rect x="460" y="50" width="205" height="230" rx="14" fill="#16345c"/>
  <text x="562" y="85" text-anchor="middle" fill="#e8cf87" font-size="13" font-weight="700">NRSA</text>
  <text x="562" y="108" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">NRS Establishment Act</text>
  <text x="562" y="140" text-anchor="middle" fill="#c9d3de" font-size="11">Creates the Nigeria</text>
  <text x="562" y="156" text-anchor="middle" fill="#c9d3de" font-size="11">Revenue Service (NRS),</text>
  <text x="562" y="172" text-anchor="middle" fill="#c9d3de" font-size="11">replacing FIRS</text>
  <text x="562" y="205" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">Sets who collects</text>
  <text x="562" y="221" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">it</text>

  <!-- JRBA -->
  <rect x="680" y="50" width="205" height="230" rx="14" fill="#0d2340"/>
  <text x="782" y="85" text-anchor="middle" fill="#e8cf87" font-size="13" font-weight="700">JRBA</text>
  <text x="782" y="108" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Joint Revenue Board Act</text>
  <text x="782" y="140" text-anchor="middle" fill="#c9d3de" font-size="11">Tax Appeal Tribunal +</text>
  <text x="782" y="156" text-anchor="middle" fill="#c9d3de" font-size="11">Office of the Tax Ombud</text>
  <text x="782" y="172" text-anchor="middle" fill="#c9d3de" font-size="11">for dispute resolution</text>
  <text x="782" y="205" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">Sets how disputes</text>
  <text x="782" y="221" text-anchor="middle" fill="#e8cf87" font-size="11" font-weight="700">get resolved</text>

  <rect x="20" y="290" width="860" height="1" fill="none"/>
</svg>

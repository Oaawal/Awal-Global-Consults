<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <!-- Left: Goods -->
  <rect x="20" y="20" width="420" height="340" rx="16" fill="#0f2747"/>
  <text x="230" y="65" text-anchor="middle" fill="#e3c46b" font-size="14" font-weight="700" letter-spacing="1">CLASSES 1&#8211;34</text>
  <text x="230" y="95" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Goods</text>
  <text x="230" y="120" text-anchor="middle" fill="#c9d3de" font-size="13">Physical products</text>

  <g fill="#ffffff" font-size="13">
    <circle cx="55" cy="160" r="4" fill="#c9a646"/>
    <text x="70" y="165">Class 25 &#8211; Clothing, footwear, headgear</text>
    <circle cx="55" cy="195" r="4" fill="#c9a646"/>
    <text x="70" y="200">Class 29/30 &#8211; Food &amp; beverage products</text>
    <circle cx="55" cy="230" r="4" fill="#c9a646"/>
    <text x="70" y="235">Class 9 &#8211; Software, tech hardware</text>
    <circle cx="55" cy="265" r="4" fill="#c9a646"/>
    <text x="70" y="270">Class 3 &#8211; Cosmetics, cleaning products</text>
    <circle cx="55" cy="300" r="4" fill="#c9a646"/>
    <text x="70" y="305">Class 32/33 &#8211; Drinks, beverages</text>
  </g>

  <!-- Right: Services -->
  <rect x="460" y="20" width="420" height="340" rx="16" fill="#f2f4f7"/>
  <text x="670" y="65" text-anchor="middle" fill="#8a7229" font-size="14" font-weight="700" letter-spacing="1">CLASSES 35&#8211;45</text>
  <text x="670" y="95" text-anchor="middle" fill="#0f2747" font-size="24" font-weight="700">Services</text>
  <text x="670" y="120" text-anchor="middle" fill="#5f6b7a" font-size="13">What a business does</text>

  <g fill="#0f2747" font-size="13">
    <circle cx="495" cy="160" r="4" fill="#0f2747"/>
    <text x="510" y="165">Class 35 &#8211; Retail, consulting, admin</text>
    <circle cx="495" cy="195" r="4" fill="#0f2747"/>
    <text x="510" y="200">Class 43 &#8211; Restaurants, food service</text>
    <circle cx="495" cy="230" r="4" fill="#0f2747"/>
    <text x="510" y="235">Class 42 &#8211; Software &amp; tech services</text>
    <circle cx="495" cy="265" r="4" fill="#0f2747"/>
    <text x="510" y="270">Class 36 &#8211; Financial services</text>
    <circle cx="495" cy="300" r="4" fill="#0f2747"/>
    <text x="510" y="305">Class 45 &#8211; Legal &amp; personal services</text>
  </g>

  <circle cx="450" cy="190" r="30" fill="#ffffff" stroke="#c9a646" stroke-width="3"/>
  <text x="450" y="196" text-anchor="middle" fill="#0f2747" font-size="13" font-weight="700">45</text>
</svg>

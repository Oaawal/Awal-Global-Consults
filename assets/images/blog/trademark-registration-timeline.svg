<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="220" fill="#ffffff"/>
  <line x1="60" y1="60" x2="840" y2="60" stroke="#e3c46b" stroke-width="3"/>

  <circle cx="60" cy="60" r="22" fill="#0f2747"/>
  <text x="60" y="67" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
  <text x="60" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Search</text>
  <text x="60" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">Clearance check</text>

  <circle cx="216" cy="60" r="22" fill="#0f2747"/>
  <text x="216" y="67" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
  <text x="216" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Class Selection</text>
  <text x="216" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">Goods / services</text>

  <circle cx="372" cy="60" r="22" fill="#0f2747"/>
  <text x="372" y="67" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
  <text x="372" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Filing</text>
  <text x="372" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">Submitted to NIPO</text>

  <circle cx="528" cy="60" r="22" fill="#0f2747"/>
  <text x="528" y="67" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">4</text>
  <text x="528" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Examination</text>
  <text x="528" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">Conflict review</text>

  <circle cx="684" cy="60" r="22" fill="#0f2747"/>
  <text x="684" y="67" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">5</text>
  <text x="684" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Publication</text>
  <text x="684" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">Opposition window</text>

  <circle cx="840" cy="60" r="22" fill="#c9a646"/>

  <text x="840" y="105" text-anchor="middle" fill="#0f2747" font-size="14" font-weight="700">Certificate</text>
  <text x="840" y="123" text-anchor="middle" fill="#5f6b7a" font-size="11">7-year term</text>

  <rect x="20" y="155" width="860" height="50" rx="10" fill="#f2f4f7"/>
  <text x="450" y="184" text-anchor="middle" fill="#0f2747" font-size="13" font-weight="700">Typical timeline: 12&#8211;24 months from filing to certificate</text>
